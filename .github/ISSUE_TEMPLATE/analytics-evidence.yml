name: Analytics evidence note
description: Describe a player-initiated local analytics export without pasting raw data.
title: "[Evidence] "
body:
  - type: markdown
    attributes:
      value: |
        Use this only for voluntary player-initiated evidence notes.

        GitHub Issues are public. Do not paste private information or raw analytics exports into this issue. If you used Export local analytics, review the file first and attach it only when you are comfortable sharing it publicly.
  - type: input
    id: game
    attributes:
      label: Game or mission
      description: Which game, gate-sample mission, or seed campaign produced the export?
  - type: textarea
    id: summary
    attributes:
      label: What the export represents
      description: Summarize the experience in words instead of pasting raw event data.
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Sharing check
      options:
        - label: I reviewed any file I chose to attach and understand this issue is public.
          required: true
