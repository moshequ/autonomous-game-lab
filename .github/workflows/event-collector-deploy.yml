name: Event Collector Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Autonomous Daily Studio', 'Production Input Watch']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: event-collector
  cancel-in-progress: false

jobs:
  collector:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AGL_EVENT_COLLECTOR_R2_BUCKET: ${{ vars.AGL_EVENT_COLLECTOR_R2_BUCKET }}
      AGL_EVENT_COLLECTOR_ALLOWED_ORIGINS: ${{ vars.AGL_EVENT_COLLECTOR_ALLOWED_ORIGINS }}
      VITE_EVENT_COLLECTOR_URL: ${{ vars.VITE_EVENT_COLLECTOR_URL }}
      AGL_EVENT_COLLECTOR_EXPORT_URL: ${{ vars.AGL_EVENT_COLLECTOR_EXPORT_URL }}
      VITE_EVENT_COLLECTOR_WRITE_TOKEN: ${{ secrets.VITE_EVENT_COLLECTOR_WRITE_TOKEN }}
      AGL_EVENT_COLLECTOR_ADMIN_TOKEN: ${{ secrets.AGL_EVENT_COLLECTOR_ADMIN_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify collector behavior
        run: npm run autonomous:event-collector-smoke

      - name: Refresh production environment evidence
        run: npm run autonomous:env

      - name: Generate collector deployment plan
        run: npm run autonomous:collector-deploy-plan

      - name: Resolve collector deploy readiness
        run: |
          required=(
            CLOUDFLARE_ACCOUNT_ID
            CLOUDFLARE_API_TOKEN
            AGL_EVENT_COLLECTOR_R2_BUCKET
            AGL_EVENT_COLLECTOR_ALLOWED_ORIGINS
            VITE_EVENT_COLLECTOR_URL
            AGL_EVENT_COLLECTOR_EXPORT_URL
            VITE_EVENT_COLLECTOR_WRITE_TOKEN
            AGL_EVENT_COLLECTOR_ADMIN_TOKEN
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} )); then
            echo "COLLECTOR_DEPLOY_READY=false" >> "$GITHUB_ENV"
            echo "Cloudflare collector deployment is not configured yet."
            printf 'Missing collector deploy inputs: %s\n' "${missing[*]}"
            cat reports/event-collector-deployment-latest.md
          else
            echo "COLLECTOR_DEPLOY_READY=true" >> "$GITHUB_ENV"
          fi

      - name: Ensure R2 bucket exists
        if: env.COLLECTOR_DEPLOY_READY == 'true'
        run: |
          npx wrangler@latest r2 bucket create "$AGL_EVENT_COLLECTOR_R2_BUCKET" ||
            npx wrangler@latest r2 bucket list | grep -F "$AGL_EVENT_COLLECTOR_R2_BUCKET"

      - name: Render Wrangler config
        if: env.COLLECTOR_DEPLOY_READY == 'true'
        run: |
          mkdir -p .wrangler
          cat > .wrangler/event-collector.toml <<EOF
          name = "autonomous-game-lab-events"
          main = "ops/cloudflare/event-collector-worker.mjs"
          compatibility_date = "2026-05-18"
          account_id = "${CLOUDFLARE_ACCOUNT_ID}"

          [vars]
          ALLOWED_ORIGINS = "${AGL_EVENT_COLLECTOR_ALLOWED_ORIGINS}"
          PUBLIC_WRITE_TOKEN = "${VITE_EVENT_COLLECTOR_WRITE_TOKEN}"

          [[r2_buckets]]
          binding = "EVENT_BUCKET"
          bucket_name = "${AGL_EVENT_COLLECTOR_R2_BUCKET}"
          EOF

      - name: Assert configured collector plan
        if: env.COLLECTOR_DEPLOY_READY == 'true'
        run: node scripts/event-collector-deploy-plan.mjs --assert-configured

      - name: Deploy event collector Worker
        if: env.COLLECTOR_DEPLOY_READY == 'true'
        run: npx wrangler@latest deploy --config .wrangler/event-collector.toml

      - name: Sync admin export secret
        if: env.COLLECTOR_DEPLOY_READY == 'true'
        run: printf "%s" "$AGL_EVENT_COLLECTOR_ADMIN_TOKEN" | npx wrangler@latest secret put ADMIN_EXPORT_TOKEN --config .wrangler/event-collector.toml

      - name: Upload collector artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-collector-deployment
          path: |
            data/event-collector-*.json
            reports/event-collector-*.md
          if-no-files-found: ignore
