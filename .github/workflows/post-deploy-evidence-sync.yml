name: Post-Deploy Evidence Sync

on:
  workflow_run:
    workflows: ['Web PWA Deploy']
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Completed Web PWA Deploy run id to import'
        required: false
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: post-deploy-evidence-sync
  cancel-in-progress: false

jobs:
  sync-post-deploy-evidence:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh default branch
        run: git pull --ff-only origin "${GITHUB_REF_NAME:-main}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync strict deployed smoke evidence
        env:
          AGL_DEPLOYED_PWA_ORIGIN: ${{ vars.AGL_PUBLIC_ORIGIN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          POST_DEPLOY_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: npm run autonomous:post-deploy-artifact-sync -- --run-id="${POST_DEPLOY_RUN_ID}" --assert

      - name: Run continuous live site monitor
        env:
          AGL_LIVE_SITE_ORIGIN: ${{ vars.AGL_PUBLIC_ORIGIN }}
        run: npm run autonomous:live-monitor

      - name: Refresh production readiness evidence
        env:
          AGL_ANDROID_KEYSTORE_BASE64: ${{ secrets.AGL_ANDROID_KEYSTORE_BASE64 }}
          AGL_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.AGL_ANDROID_KEYSTORE_PASSWORD }}
          AGL_ANDROID_KEY_ALIAS: ${{ secrets.AGL_ANDROID_KEY_ALIAS }}
          AGL_ANDROID_PACKAGE_NAME: ${{ vars.AGL_ANDROID_PACKAGE_NAME }}
          AGL_ANDROID_RELEASE_MODE: ${{ vars.AGL_ANDROID_RELEASE_MODE }}
          AGL_ANDROID_RELEASE_TRACK: ${{ vars.AGL_ANDROID_RELEASE_TRACK }}
          AGL_ANDROID_SHA256_CERT_FINGERPRINT: ${{ vars.AGL_ANDROID_SHA256_CERT_FINGERPRINT }}
          AGL_APPLE_DEVELOPER_ACCOUNT_CONNECTED: ${{ vars.AGL_APPLE_DEVELOPER_ACCOUNT_CONNECTED }}
          AGL_PUBLIC_ORIGIN: ${{ vars.AGL_PUBLIC_ORIGIN }}
          AGL_AUTONOMOUS_SELF_UPDATE: ${{ vars.AGL_AUTONOMOUS_SELF_UPDATE }}
          AGL_AUTONOMOUS_SELF_UPDATE_DIRECT: ${{ vars.AGL_AUTONOMOUS_SELF_UPDATE_DIRECT }}
          AGL_EVENT_COLLECTOR_ADMIN_TOKEN: ${{ secrets.AGL_EVENT_COLLECTOR_ADMIN_TOKEN }}
          AGL_EVENT_COLLECTOR_ALLOWED_ORIGINS: ${{ vars.AGL_EVENT_COLLECTOR_ALLOWED_ORIGINS }}
          AGL_EVENT_COLLECTOR_EXPORT_URL: ${{ vars.AGL_EVENT_COLLECTOR_EXPORT_URL }}
          AGL_EVENT_COLLECTOR_R2_BUCKET: ${{ vars.AGL_EVENT_COLLECTOR_R2_BUCKET }}
          AGL_GOOGLE_PLAY_ACCOUNT_CONNECTED: ${{ vars.AGL_GOOGLE_PLAY_ACCOUNT_CONNECTED }}
          AGL_SUPPORT_EMAIL: ${{ vars.AGL_SUPPORT_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ github.token }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          ADMOB_PUBLISHER_ID: ${{ vars.ADMOB_PUBLISHER_ID }}
          AD_NETWORK_PROVIDER: ${{ vars.AD_NETWORK_PROVIDER }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          VITE_ADSENSE_CLIENT_ID: ${{ vars.VITE_ADSENSE_CLIENT_ID }}
          VITE_ADSENSE_REWARDED_SLOT_ID: ${{ vars.VITE_ADSENSE_REWARDED_SLOT_ID }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
          VITE_EVENT_COLLECTOR_URL: ${{ vars.VITE_EVENT_COLLECTOR_URL }}
          VITE_EVENT_COLLECTOR_WRITE_TOKEN: ${{ secrets.VITE_EVENT_COLLECTOR_WRITE_TOKEN }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_PUBLIC_ORIGIN: ${{ vars.VITE_PUBLIC_ORIGIN }}
        run: npm run autonomous:post-deploy-readiness-sync

      - name: Verify synced deploy evidence
        run: npm run autonomous:verify-post-deploy-sync

      - name: Commit synced deploy evidence
        env:
          AGL_AUTONOMOUS_SELF_UPDATE_DIRECT: ${{ vars.AGL_AUTONOMOUS_SELF_UPDATE_DIRECT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ "${AGL_AUTONOMOUS_SELF_UPDATE_DIRECT:-0}" != "1" ]]; then
            echo "skip commit: AGL_AUTONOMOUS_SELF_UPDATE_DIRECT is not enabled"
            exit 0
          fi

          git add -- \
            data/post-deploy-artifact-sync.json \
            src/data/postDeployArtifactSync.ts \
            reports/post-deploy-artifact-sync-latest.md \
            data/public-repo-security-audit.json \
            src/data/publicRepoSecurityAudit.ts \
            reports/public-repo-security-audit-latest.md \
            data/performance-budget.json \
            src/data/performanceBudget.ts \
            reports/performance-budget-latest.md \
            data/release-candidate.json \
            src/data/releaseCandidate.ts \
            reports/release-candidate-latest.md \
            data/pwa-install-loop.json \
            src/data/pwaInstallLoop.ts \
            reports/pwa-install-loop-latest.md \
            public/install.html \
            data/store-package.json \
            reports/store-package-latest.md \
            public/privacy.html \
            public/support.html \
            public/compliance.json \
            data/store-assets.json \
            src/data/storeAssets.ts \
            reports/store-assets-latest.md \
            public/store-assets/screenshots \
            data/store-listing-optimizer.json \
            src/data/storeListingOptimizer.ts \
            reports/store-listing-optimizer-latest.md \
            data/store-compliance.json \
            src/data/storeCompliance.ts \
            reports/store-compliance-latest.md \
            data/post-deploy-smoke.json \
            src/data/postDeploySmoke.ts \
            reports/post-deploy-smoke-latest.md \
            data/live-site-monitor.json \
            src/data/liveSiteMonitor.ts \
            reports/live-site-monitor-latest.md \
            data/repository-readiness.json \
            src/data/repositoryReadiness.ts \
            reports/repository-readiness-latest.md \
            data/repository-bootstrap.json \
            src/data/repositoryBootstrap.ts \
            reports/repository-bootstrap-latest.md \
            ops/github/bootstrap-repository.sh \
            data/deployment-plan.json \
            src/data/deploymentPlan.ts \
            reports/deployment-plan-latest.md \
            data/production-environment.json \
            src/data/productionEnvironment.ts \
            reports/production-environment-latest.md \
            ops/production.env.example \
            data/production-bootstrap.json \
            src/data/productionBootstrap.ts \
            reports/production-bootstrap-latest.md \
            ops/github/setup-production.sh \
            ops/github/README.md \
            data/production-activation.json \
            src/data/productionActivation.ts \
            reports/production-activation-latest.md \
            data/production-blocker-handoff.json \
            src/data/productionBlockerHandoff.ts \
            reports/production-blocker-handoff-latest.md \
            data/owner-unlock-brief.json \
            data/owner-unlock-preflight.json \
            public/owner-unlock-brief.json \
            reports/owner-unlock-brief-latest.md \
            reports/owner-unlock-preflight-latest.md \
            data/production-unlock-runner.json \
            src/data/productionUnlockRunner.ts \
            reports/production-unlock-runner-latest.md \
            data/production-measurement-status.json \
            src/data/productionMeasurementStatus.ts \
            public/measurement-status.html \
            public/measurement-status.json \
            public/analytics-unlock.html \
            public/analytics-unlock.json \
            reports/production-measurement-status-latest.md \
            data/player-evidence-watchdog.json \
            src/data/playerEvidenceWatchdog.ts \
            reports/player-evidence-watchdog-latest.md \
            data/production-readiness.json \
            reports/production-readiness-latest.md \
            data/objective-audit.json \
            src/data/objectiveAudit.ts \
            reports/objective-audit-latest.md \
            data/autonomous-operator.json \
            src/data/autonomousOperator.ts \
            reports/autonomous-operator-latest.md \
            data/autonomous-operator-history.json \
            src/data/autonomousOperatorHistory.ts \
            reports/autonomous-operator-history-latest.md \
            data/autonomous-owner-loop.json \
            src/data/autonomousOwnerLoop.ts \
            reports/autonomous-owner-loop-latest.md

          if git diff --cached --quiet; then
            echo "no synced deploy evidence changes to commit"
            exit 0
          fi

          git config user.name "autonomous-game-lab-bot"
          git config user.email "autonomous-game-lab-bot@users.noreply.github.com"
          git commit -m "Autonomous post-deploy evidence sync"
          git push

      - name: Upload evidence sync artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-evidence-sync
          path: |
            data/post-deploy-artifact-sync.json
            reports/post-deploy-artifact-sync-latest.md
            data/public-repo-security-audit.json
            reports/public-repo-security-audit-latest.md
            data/performance-budget.json
            reports/performance-budget-latest.md
            data/release-candidate.json
            reports/release-candidate-latest.md
            data/pwa-install-loop.json
            reports/pwa-install-loop-latest.md
            public/install.html
            data/store-package.json
            reports/store-package-latest.md
            public/privacy.html
            public/support.html
            public/compliance.json
            data/store-assets.json
            reports/store-assets-latest.md
            public/store-assets/screenshots/
            data/store-listing-optimizer.json
            reports/store-listing-optimizer-latest.md
            data/store-compliance.json
            reports/store-compliance-latest.md
            data/post-deploy-smoke.json
            reports/post-deploy-smoke-latest.md
            data/live-site-monitor.json
            reports/live-site-monitor-latest.md
            data/repository-readiness.json
            reports/repository-readiness-latest.md
            data/repository-bootstrap.json
            reports/repository-bootstrap-latest.md
            data/deployment-plan.json
            reports/deployment-plan-latest.md
            data/production-environment.json
            reports/production-environment-latest.md
            ops/production.env.example
            data/production-bootstrap.json
            reports/production-bootstrap-latest.md
            data/production-activation.json
            reports/production-activation-latest.md
            data/production-blocker-handoff.json
            reports/production-blocker-handoff-latest.md
            data/owner-unlock-brief.json
            data/owner-unlock-preflight.json
            public/owner-unlock-brief.json
            reports/owner-unlock-brief-latest.md
            reports/owner-unlock-preflight-latest.md
            data/production-unlock-runner.json
            reports/production-unlock-runner-latest.md
            data/production-measurement-status.json
            reports/production-measurement-status-latest.md
            data/player-evidence-watchdog.json
            reports/player-evidence-watchdog-latest.md
            public/measurement-status.html
            public/measurement-status.json
            public/analytics-unlock.html
            public/analytics-unlock.json
            data/production-readiness.json
            reports/production-readiness-latest.md
            data/objective-audit.json
            reports/objective-audit-latest.md
            data/autonomous-operator.json
            reports/autonomous-operator-latest.md
            data/autonomous-operator-history.json
            reports/autonomous-operator-history-latest.md
            data/autonomous-owner-loop.json
            reports/autonomous-owner-loop-latest.md
          if-no-files-found: ignore
