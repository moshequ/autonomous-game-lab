name: Autonomous Self Update

on:
  workflow_run:
    workflows: ['Autonomous Daily Studio']
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: autonomous-self-update
  cancel-in-progress: false

jobs:
  persist-verified-improvements:
    if: ${{ vars.AGL_AUTONOMOUS_SELF_UPDATE == '1' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for post-deploy evidence sync
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$((SECONDS + 900))
          while (( SECONDS < deadline )); do
            sync_run_id="$(
              gh run list \
                --workflow "Post-Deploy Evidence Sync" \
                --branch "${GITHUB_REF_NAME:-main}" \
                --json databaseId,headSha,status,conclusion \
                --limit 30 \
                --jq ".[] | select(.headSha == \"${EXPECTED_HEAD_SHA}\" and .status == \"completed\" and .conclusion == \"success\") | .databaseId" \
                | head -n 1
            )"
            if [[ -n "${sync_run_id}" ]]; then
              echo "post-deploy evidence sync ready: ${sync_run_id}"
              exit 0
            fi
            sleep 10
          done

          echo "timed out waiting for post-deploy evidence sync for ${EXPECTED_HEAD_SHA}" >&2
          exit 1

      - name: Refresh default branch
        run: git pull --ff-only origin "${GITHUB_REF_NAME:-main}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Reproduce autonomous owner loop
        env:
          AGL_ANDROID_KEYSTORE_BASE64: ${{ secrets.AGL_ANDROID_KEYSTORE_BASE64 }}
          AGL_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.AGL_ANDROID_KEYSTORE_PASSWORD }}
          AGL_ANDROID_KEY_ALIAS: ${{ secrets.AGL_ANDROID_KEY_ALIAS }}
          AGL_ANDROID_PACKAGE_NAME: ${{ vars.AGL_ANDROID_PACKAGE_NAME }}
          AGL_ANDROID_SHA256_CERT_FINGERPRINT: ${{ vars.AGL_ANDROID_SHA256_CERT_FINGERPRINT }}
          AGL_AUTONOMOUS_SELF_UPDATE: ${{ vars.AGL_AUTONOMOUS_SELF_UPDATE }}
          AGL_AUTONOMOUS_SELF_UPDATE_DIRECT: ${{ vars.AGL_AUTONOMOUS_SELF_UPDATE_DIRECT }}
          AGL_EVENT_COLLECTOR_ADMIN_TOKEN: ${{ secrets.AGL_EVENT_COLLECTOR_ADMIN_TOKEN }}
          AGL_EVENT_COLLECTOR_ALLOWED_ORIGINS: ${{ vars.AGL_EVENT_COLLECTOR_ALLOWED_ORIGINS }}
          AGL_EVENT_COLLECTOR_EXPORT_URL: ${{ vars.AGL_EVENT_COLLECTOR_EXPORT_URL }}
          AGL_EVENT_COLLECTOR_R2_BUCKET: ${{ vars.AGL_EVENT_COLLECTOR_R2_BUCKET }}
          AGL_PUBLIC_ORIGIN: ${{ vars.AGL_PUBLIC_ORIGIN }}
          GITHUB_TOKEN: ${{ github.token }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
          VITE_EVENT_COLLECTOR_URL: ${{ vars.VITE_EVENT_COLLECTOR_URL }}
          VITE_EVENT_COLLECTOR_WRITE_TOKEN: ${{ secrets.VITE_EVENT_COLLECTOR_WRITE_TOKEN }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_PUBLIC_ORIGIN: ${{ vars.VITE_PUBLIC_ORIGIN }}
        run: npm run autonomous:operate

      - name: Assert self-update safety
        env:
          AGL_AUTONOMOUS_SELF_UPDATE: ${{ vars.AGL_AUTONOMOUS_SELF_UPDATE }}
          AGL_AUTONOMOUS_SELF_UPDATE_DIRECT: ${{ vars.AGL_AUTONOMOUS_SELF_UPDATE_DIRECT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run autonomous:self-update -- --assert-safe

      - name: Commit verified autonomous changes
        env:
          AGL_AUTONOMOUS_SELF_UPDATE_DIRECT: ${{ vars.AGL_AUTONOMOUS_SELF_UPDATE_DIRECT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ "${AGL_AUTONOMOUS_SELF_UPDATE_DIRECT:-0}" != "1" ]]; then
            echo "skip commit: AGL_AUTONOMOUS_SELF_UPDATE_DIRECT is not enabled"
            exit 0
          fi

          node - <<'NODE' > /tmp/autonomous-self-update-files.txt
          const fs = require('fs')
          const plan = JSON.parse(fs.readFileSync('data/autonomous-self-update.json', 'utf8'))
          if (plan.status !== 'self-update-ready') {
            console.error(`self-update status is ${plan.status}`)
            process.exit(1)
          }
          if ((plan.pendingChanges?.unsafeCount ?? 0) > 0) {
            console.error('unsafe pending changes are present')
            process.exit(1)
          }
          for (const filePath of plan.commitPlan?.stagePaths ?? []) {
            if (fs.existsSync(filePath)) {
              console.log(filePath)
            }
          }
          NODE

          if [[ ! -s /tmp/autonomous-self-update-files.txt ]]; then
            echo "no allowlisted autonomous files to stage"
            exit 0
          fi

          xargs -a /tmp/autonomous-self-update-files.txt git add --

          if git diff --cached --quiet; then
            echo "no verified autonomous changes to commit"
            exit 0
          fi

          git config user.name "autonomous-game-lab-bot"
          git config user.email "autonomous-game-lab-bot@users.noreply.github.com"
          git commit -m "Autonomous daily self-update"
          git push

      - name: Upload self-update artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-self-update
          path: |
            data/autonomous-self-update.json
            reports/autonomous-self-update-latest.md
          if-no-files-found: ignore
